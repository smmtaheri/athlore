name: athlore

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coach_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-coach_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LANG: C.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coach_assistant} -d ${POSTGRES_DB:-coach_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks:
      - internal

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    environment:
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-coach_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-coach_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-athlore.ir}
      COACH_DOMAIN: ${COACH_DOMAIN:-coach.athlore.ir}
      STUDENT_DOMAIN: ${STUDENT_DOMAIN:-student.athlore.ir}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-athlore.ir,coach.athlore.ir,student.athlore.ir}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://athlore.ir,https://coach.athlore.ir,https://student.athlore.ir}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      # When true, entrypoint seeds pilot fixtures and sets the known demo password.
      LOAD_DEMO_FIXTURES: ${LOAD_DEMO_FIXTURES:-false}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://athlore.ir/api/v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://athlore.ir,https://coach.athlore.ir,https://student.athlore.ir}
      DJANGO_MEDIA_ROOT: ${DJANGO_MEDIA_ROOT:-/data/media}
      # Read by coach_copilot/settings.py; Nginx also enforces edge policies.
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-true}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-true}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-HTTP_X_FORWARDED_PROTO,https}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = os.environ.get('PUBLIC_DOMAIN', 'athlore.ir'); request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/staticfiles
    networks:
      - internal

  frontend:
    build:
      context: ../../apps/front
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-athlore.ir}
        VITE_COACH_DOMAIN: ${COACH_DOMAIN:-coach.athlore.ir}
        VITE_STUDENT_DOMAIN: ${STUDENT_DOMAIN:-student.athlore.ir}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/rendered/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - internal
      - default

networks:
  # postgres/backend/frontend have no route out of this network (no internet,
  # no host access) — nginx joins `default` too so its published origin port
  # works. TLS is terminated by the ParsPack CDN before this origin.
  internal:
    internal: true
  default:

volumes:
  postgres_data:
  media_data:
