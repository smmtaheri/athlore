name: athlore-stage

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LANG: C.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks:
      - internal

  backend:
    image: athlore-stage-backend:${STAGE_IMAGE_TAG:-latest}
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    environment:
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      COACH_DOMAIN: ${COACH_DOMAIN}
      STUDENT_DOMAIN: ${STUDENT_DOMAIN}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      LOAD_DEMO_FIXTURES: ${LOAD_DEMO_FIXTURES:-false}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      DJANGO_MEDIA_ROOT: ${DJANGO_MEDIA_ROOT:-/data/media}
      LOGIN_OTP_ENABLED: ${LOGIN_OTP_ENABLED:-true}
      LOGIN_OTP_PROVIDER: najva
      SMS_BACKEND: najva
      NAJVA_API_KEY: ${NAJVA_API_KEY:-}
      NAJVA_SENDER: ${NAJVA_SENDER:-100005676}
      NAJVA_TEMPLATE: ${NAJVA_TEMPLATE:-athlore_otp}
      PROGRAM_READY_SMS_ENABLED: ${PROGRAM_READY_SMS_ENABLED:-true}
      NAJVA_PROGRAM_READY_TEMPLATE: ${NAJVA_PROGRAM_READY_TEMPLATE:-athlore_program_ready}
      VISIT_FINALIZED_SMS_ENABLED: ${VISIT_FINALIZED_SMS_ENABLED:-true}
      NAJVA_VISIT_FINALIZED_TEMPLATE: ${NAJVA_VISIT_FINALIZED_TEMPLATE:-athlore_visit_finalized}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-true}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-true}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-HTTP_X_FORWARDED_PROTO,https}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = os.environ['PUBLIC_DOMAIN']; request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/staticfiles
    networks:
      - internal
      - sms_egress

  visit-photo-pruner:
    image: athlore-stage-backend:${STAGE_IMAGE_TAG:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do python manage.py prune_staged_visit_photos || exit 1; python manage.py prune_staged_program_pdfs || exit 1; sleep 3600; done"]
    user: "10001:10001"
    environment:
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_MEDIA_ROOT: ${DJANGO_MEDIA_ROOT:-/data/media}
    volumes:
      - media_data:/data/media
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal

  exercise-video-worker:
    image: athlore-stage-backend:${STAGE_IMAGE_TAG:-latest}
    entrypoint: ["python", "manage.py", "process_exercise_videos"]
    user: "10001:10001"
    environment:
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_MEDIA_ROOT: ${DJANGO_MEDIA_ROOT:-/data/media}
    volumes:
      - media_data:/data/media
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    tmpfs:
      - /tmp
    networks:
      - internal

  frontend:
    image: athlore-stage-frontend:${STAGE_IMAGE_TAG:-latest}
    build:
      context: ../../apps/front
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
        VITE_COACH_DOMAIN: ${COACH_DOMAIN}
        VITE_STUDENT_DOMAIN: ${STUDENT_DOMAIN}
        VITE_LOGIN_OTP_ENABLED: ${VITE_LOGIN_OTP_ENABLED:-true}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/rendered/stage-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - media_data:/data/media:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      internal: {}
      edge:
        aliases:
          - athlore-stage-nginx

networks:
  # Only the backend can reach Najva. This network publishes no host ports.
  sms_egress:
    driver: bridge
  internal:
    internal: true
  edge:
    name: athlore-edge
    external: true

volumes:
  postgres_data:
    name: athlore-stage-postgres-data
  media_data:
    name: athlore-stage-media-data
