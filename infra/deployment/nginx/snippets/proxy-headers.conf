# Standard proxy headers for both the backend and frontend upstreams.
# ParsPack terminates client HTTPS before the origin. The mapped value
# preserves its X-Forwarded-Proto header for Django.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $athlore_forwarded_proto;
proxy_read_timeout 120s;
