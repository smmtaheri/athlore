# Baseline security headers, included in every server/location block.
# Note: add_header does NOT inherit from a parent context into a location
# block that defines its own add_header directives — every location that
# needs these must `include` this file itself (nginx merges by textual
# inclusion here, so this is safe to include in multiple nested blocks).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP tailored for the Vite-built SPA. Vite emits content-hashed JS/CSS
# files loaded via <script>/<link> tags, so 'unsafe-inline' is NOT enabled
# for script-src or style-src by default. The frontend currently has no
# CSS-in-JS library and self-hosts its only font (@fontsource/vazirmatn), so
# style-src/font-src 'self' should be sufficient — but this was not verified
# against a running production build's browser console as part of this
# change. If the UI reports CSP violations for inline <style>/style attrs,
# relax style-src here to "'self' 'unsafe-inline'" (never add 'unsafe-eval'
# or 'unsafe-inline' to script-src).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
